<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AMBER</title>
  <desc id="desc">Amber gemstone crossed by three asymmetric binary query planes, beside the AMBER wordmark.</desc>
  <defs>
    <linearGradient id="amber-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1A8"/>
      <stop offset="0.28" stop-color="#FFC247"/>
      <stop offset="0.66" stop-color="#F28A16"/>
      <stop offset="1" stop-color="#A94608"/>
    </linearGradient>
    <linearGradient id="amber-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#C95B0B"/>
    </linearGradient>
    <linearGradient id="query-ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB11B" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFB11B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFF0B0" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="gem-clip">
      <path d="M156 28 260 83 279 190 210 282 96 282 28 190 48 83Z"/>
    </clipPath>
    <style>
      .wordmark { fill: #ffb454; stroke: #5f2907; stroke-width: 1; paint-order: stroke fill; }
      .descriptor { fill: #e0af68; }
      .tagline { fill: #ff9e64; }
    </style>
  </defs>

  <g transform="translate(10 0)">
    <path d="M156 20 267 79 287 193 214 290 92 290 20 193 41 79Z" fill="#F39A1E" opacity="0.18" filter="url(#soft-glow)"/>
    <path d="M156 28 260 83 279 190 210 282 96 282 28 190 48 83Z" fill="url(#amber-core)" stroke="url(#amber-edge)" stroke-width="8" stroke-linejoin="round"/>
    <g clip-path="url(#gem-clip)">
      <path d="M42 88 156 28 144 282 96 282 28 190Z" fill="#FFF5C7" opacity="0.25"/>
      <path d="M156 28 260 83 210 282 179 282Z" fill="#7B2505" opacity="0.18"/>
      <path d="M35 158H276" stroke="#7A2B08" stroke-width="3" opacity="0.35"/>
      <path d="M40 110H271" stroke="#FFF5D1" stroke-width="2" opacity="0.45"/>
      <path d="M31 214H265" stroke="#6B2208" stroke-width="4" opacity="0.28"/>
    </g>

    <g fill="none" stroke="url(#query-ray)" stroke-linecap="round">
      <path d="M0 109H118" stroke-width="5"/>
      <path d="M0 160H118" stroke-width="10"/>
      <path d="M0 215H118" stroke-width="16"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="700" text-anchor="middle">
      <g fill="#6E2709">
        <circle cx="92" cy="109" r="17" fill="#FFF2B8" fill-opacity="0.9"/>
        <text x="92" y="116">0</text>
        <circle cx="151" cy="109" r="17" fill="#FFF2B8" fill-opacity="0.9"/>
        <text x="151" y="116">1</text>
        <circle cx="211" cy="109" r="17" fill="#FFF2B8" fill-opacity="0.9"/>
        <text x="211" y="116">1</text>
      </g>
      <g fill="#FFF9E8">
        <circle cx="92" cy="160" r="17" fill="#9C3E09" fill-opacity="0.78"/>
        <text x="92" y="167">1</text>
        <circle cx="151" cy="160" r="17" fill="#9C3E09" fill-opacity="0.78"/>
        <text x="151" y="167">0</text>
        <circle cx="211" cy="160" r="17" fill="#9C3E09" fill-opacity="0.78"/>
        <text x="211" y="167">1</text>
      </g>
      <g fill="#6E2709">
        <circle cx="92" cy="215" r="17" fill="#FFD565" fill-opacity="0.92"/>
        <text x="92" y="222">1</text>
        <circle cx="151" cy="215" r="17" fill="#FFD565" fill-opacity="0.92"/>
        <text x="151" y="222">1</text>
        <circle cx="211" cy="215" r="17" fill="#FFD565" fill-opacity="0.92"/>
        <text x="211" y="222">0</text>
      </g>
    </g>

    <path d="M156 47 241 91" stroke="#FFF8DA" stroke-width="8" stroke-linecap="round" opacity="0.62"/>
    <circle cx="156" cy="160" r="115" fill="none" stroke="#FFF5C6" stroke-width="2" opacity="0.28"/>
  </g>

  <g transform="translate(345 0)">
    <text class="wordmark" x="0" y="159" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="116" font-weight="850" letter-spacing="8">AMBER</text>
    <text class="descriptor" x="7" y="205" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650" letter-spacing="4">ASYMMETRIC MEDIAN BINARY EMBEDDING RETRIEVAL</text>
    <path d="M8 228H775" stroke="#E59422" stroke-width="2" opacity="0.55"/>
    <text class="tagline" x="7" y="267" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" letter-spacing="1">48 bytes. Build online. Rank directly.</text>
  </g>
</svg>
