<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t d">
  <title id="t">CommerceOS</title>
  <desc id="d">CommerceOS brand mark: two interlocked gradient rings above the wordmark and the line "the system of record for commerce".</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060c14"/>
      <stop offset="1" stop-color="#0b1826"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6b8cff"/>
    </linearGradient>
    <linearGradient id="gradWide" x1="220" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6b8cff"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#01060c" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b4d2e5" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="540" fill="url(#bg)"/>
  <rect width="720" height="540" fill="url(#grid)"/>
  <rect width="720" height="540" fill="url(#vig)"/>

  <!-- brand mark: two interlocked rings -->
  <g transform="translate(360 200)" filter="url(#glow)" fill="none" stroke="url(#grad)" stroke-width="16" stroke-linecap="round">
    <circle cx="-46" cy="0" r="58"/>
    <circle cx="46" cy="0" r="58"/>
    <path d="M30.7 -49.2 A58 58 0 0 1 53.7 -21.7" transform="translate(-46 0)"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="80" font-weight="700" letter-spacing="-2">
    <tspan fill="#eef4fb">Commerce</tspan><tspan fill="url(#gradWide)">OS</tspan>
  </text>
  <text x="360" y="424" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="4" fill="#7d9bb2">THE SYSTEM OF RECORD FOR COMMERCE</text>
</svg>
